name: Android 11 LSPosed Debug

on:
  workflow_dispatch:
  push:
    branches: [dev]
    paths:
      - "apps/module/**"
      - "core/**"
      - "tools/check_android11_compat.py"
      - ".github/workflows/android11-lsposed-debug.yml"

permissions:
  contents: read

jobs:
  android11-debug:
    name: Build Android 11 compatible APK
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK and NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-37.0" "build-tools;37.0.0" "ndk;29.0.13113456" "cmake;4.1.2"
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.90.0 --profile minimal --target aarch64-linux-android --target x86_64-linux-android
          python3 tools/build_rust.py --check
      - name: Block Android 11 incompatible ClassValue usage
        run: python3 tools/check_android11_compat.py
      - name: Build signed-by-debug-key LSPosed APK
        run: ./gradlew :apps:module:assembleDebug --max-workers=1 --console=plain
      - name: Verify regression tests
        run: ./gradlew :apps:module:testDebugUnitTest --tests "io.github.nuke.oss.app.shared.reflect.CompatClassValueTest" --max-workers=1 --console=plain
      - name: Export APK
        run: |
          mkdir -p android11-output
          find apps/module/build/outputs/apk/debug -maxdepth 1 -name '*.apk' -type f -print -exec cp {} android11-output/nukeapp-android11-lsposed-debug.apk \;
          test -s android11-output/nukeapp-android11-lsposed-debug.apk
          sha256sum android11-output/nukeapp-android11-lsposed-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: nukeapp-android11-lsposed-debug
          path: android11-output/*.apk
          if-no-files-found: error
